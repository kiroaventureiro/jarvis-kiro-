name: Jarvis security and build checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/diretor-tecnico-agent, feature/cosmic-issue-16]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Security regression checks
        run: node --test tests/*.test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
      - name: Install browser for cosmic behavior checks
        run: npx playwright install --with-deps chromium
      - name: Cosmic scene and transient voice briefing
        run: node tests/integration/cosmic-ui.cjs

