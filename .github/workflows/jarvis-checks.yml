name: Jarvis security and build checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/diretor-tecnico-agent]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Security regression checks
        run: node --test tests/auth-security.test.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
